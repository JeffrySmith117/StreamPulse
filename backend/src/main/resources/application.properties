spring.application.name=streampulse-backend
server.port=8080

# PostgreSQL (historico de incidentes)
spring.datasource.url=jdbc:postgresql://localhost:5432/streampulse
spring.datasource.username=streampulse
spring.datasource.password=streampulse
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis (estado em tempo real por regiao)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka (ingestao dos eventos de playback)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=streampulse-backend
spring.kafka.consumer.auto-offset-reset=earliest


# Simulador de eventos (desligue em producao)
streampulse.simulator.enabled=true
streampulse.simulator.events-per-tick=200
streampulse.simulator.interval-ms=1000